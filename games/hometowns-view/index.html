<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Hometowns map</title>
    <style>
      :root {
        --bg: #f3eee3;
        --panel: #fffaf0;
        --ink: #2b2620;
        --muted: #6b6257;
        --line: #ddd2bf;
        --accent: #b4632e;
        --pos: #3a8658;
        --neg: #b54a3a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1b18;
          --panel: #26231f;
          --ink: #eee6d8;
          --muted: #a89d8e;
          --line: #3d3831;
          --accent: #e08a52;
          --pos: #6cbf8a;
          --neg: #e07a6a;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #app { display: flex; height: 100%; }
      .map { flex: 1; min-width: 0; position: relative; touch-action: none; }
      .map canvas { display: block; }
      .hud { width: 300px; flex: none; overflow-y: auto; padding: 16px; background: var(--panel); border-left: 1px solid var(--line); }
      .hud h1 { font-size: 18px; margin: 0; }
      .hud h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
      .hud-sub { margin: 2px 0 12px; color: var(--muted); }
      .hud-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
      .hud-stats dt { color: var(--muted); }
      .hud-stats dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
      .meter { display: grid; grid-template-columns: 76px 1fr 34px; align-items: center; gap: 6px; margin: 3px 0; }
      .meter-label { color: var(--muted); font-size: 12px; }
      .meter-track { position: relative; height: 8px; background: var(--line); border-radius: 2px; }
      .meter-track::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
      .meter-fill { position: absolute; top: 0; bottom: 0; background: var(--pos); border-radius: 2px; }
      .meter-fill.neg { background: var(--neg); }
      .meter-value { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
      .hud-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
      button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); cursor: pointer; }
      button[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: #fff; }
      .hud-legend { list-style: none; padding: 0; margin: 8px 0 0; font-size: 12px; }
      .hud-legend li { display: flex; align-items: center; gap: 6px; }
      .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
      .hud-inspect { min-height: 2.8em; margin: 10px 0 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; font-size: 12px; }
      .hud-seed { display: flex; gap: 6px; }
      .hud-seed input { width: 90px; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 2px; background: transparent; color: var(--ink); }
      .hud-log { list-style: none; padding: 0; margin: 0; font-size: 12px; color: var(--muted); }
      .placeholder { margin: auto; max-width: 420px; padding: 16px; }
      .placeholder a { color: var(--accent); }
      @media (max-width: 720px) {
        #app { flex-direction: column; }
        .map { flex: 1 1 60%; }
        .hud { width: auto; flex: 1 1 40%; border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
