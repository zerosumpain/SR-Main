          YWdub3N0aWMwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQDNRAkLQdFn
          uQSQhUuyWgHRJdCXcshvnWinAneGMOOYyfEX1+KskGaWH5yZ7bcVsfNfv8HOoA5g
          J9QE2LTwU0P0wyK8BjzvqLQAC25x+HSOZ3Syk1ibz+T5fi75MSDv/Y/xCjHJS+fD
          eQLboid5Zv1HZPYNH/uoj7IUWgjpjPvnUJmE0YEjjQezA9V9XqvCFdIDfDD0+mDF
          SFzas9Vc7yAdsr19BKm0IkXfpIr+XnFE+bQZ0bdsaENYmtup5c0G/pZT0vba+GKr
          4kK4yJtM+cTLjtQhQMDtbRMe+THaXJ39mUD2vxLgkuO4XITwkaEf72nzXH/7WHXG
          /2cxaggehZB5AgMBAAGjUzBRMB0GA1UdDgQWBBT6CLssORelDxuLsJ0kvozglYGy
          PjAfBgNVHSMEGDAWgBT6CLssORelDxuLsJ0kvozglYGyPjAPBgNVHRMBAf8EBTAD
          AQH/MA0GCSqGSIb3DQEBCwUAA4IBAQCPoRbZ8Npgslnpo30UcnYrJjSRovT2XaKs
          J2P0XJCeYoFjpC2pITOmvVXQvns8cjpfbJGh7Tr3f365iBN/rudp+2XZQFh4hFSL
          sCLP7zN4QE+46VZ5IERt4/8YRQSCRCJkIs0I3CTQ3u26XNcjr6wISMcI6zwlvs5c
          va/5mUF9aX7cu4ttsSseR3KnRMrdq3Fy4bJOS8yI0GHhJcuob0O3b82JZke4fBkv
          s3CPBvdGH1qSHWuCkap/jRENeb26myLCUyFd2MDmgUMTOH7Z1Qqsf5oaOlD+i4xr
          +pqj1l52dWYjPZtc7eZtlVoYH0tGYSsJEwfJGsk+3lldVdiVKu4K
          -----END CERTIFICATE-----
          CERT
          sudo bash -s > "$work/report" <<'DIAG'
          set -euo pipefail
          set -a
          . /opt/strange-rambling-svelte/.env
          set +a
          node --input-type=module <<'NODE'
          import pg from '/opt/sr-development/sources/ca3e441da16a768470e8ef22e7f0f0ff7cbc1664/node_modules/pg/lib/index.js';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});await client.connect();
          await client.query('begin read only');
          const builds=(await client.query(`select b.id,b.status,b.updated_at,b.heartbeat_at,b.model_provider,b.model_id,b.failure,b.iterations_completed,d.state->>'stage' as stage,d.state->'session' as session from jkai_builds b join jkai_build_deliveries d on d.build_id=b.id order by b.created_at desc limit 5`)).rows;
          console.log(JSON.stringify(builds));
          const {encode}=await import('/opt/sr-development/sources/ca3e441da16a768470e8ef22e7f0f0ff7cbc1664/node_modules/@auth/core/jwt.js');
          const cookieParts=[];
          for(const salt of ['authjs.session-token','__Secure-authjs.session-token'])cookieParts.push(`${salt}=${await encode({secret:process.env.AUTH_SECRET,salt,maxAge:180,token:{email:process.env.AUTH_ALLOWED_EMAILS.split(',')[0].trim(),name:'Deployment verification',sub:'deployment-verification'}})}`);
          const headers={host:'strangeramblings.com','x-forwarded-proto':'https',cookie:cookieParts.join('; ')};
          const id=builds.find(b=>b.status==='running')?.id??builds[0]?.id;
          if(id){
          const page=await fetch(`http://127.0.0.1:4173/jkai/develop/${id}`,{headers,redirect:'manual'});console.log('OWNER_WORKSPACE_HTTP',page.status);await page.body?.cancel();
          const snapshot=await fetch(`http://127.0.0.1:4173/api/jkai/development/${id}`,{headers,redirect:'manual'});
          if(snapshot.status!==200)throw new Error(`Snapshot HTTP ${snapshot.status}`);
          const data=await snapshot.json();const progress=data.progress;
          if(!progress || !Number.isFinite(progress.totalTokens) || !Number.isFinite(progress.outputTokens) || progress.totalTokens<0 || progress.outputTokens<0 || !Array.isArray(progress.iterations) || progress.iterations.length>12)throw new Error('Invalid progress response');
          if(!Object.hasOwn(progress,'verification') || !Object.hasOwn(progress,'stage') || !Object.hasOwn(progress,'testFailure') || !Object.hasOwn(data.build,'outcome'))throw new Error('Dense workspace fields missing');
          console.log('DENSE_WORKSPACE_VERIFIED',JSON.stringify({buildId:id,outcome:data.build.outcome,stage:progress.stage,verification:progress.verification,hasFailure:!!progress.testFailure,preview:data.delivery.state.preview.status,acceptanceBlocked:!!data.blocker}));
          const { readFileSync, readdirSync } = await import('node:fs');
          const assets='/opt/strange-rambling-svelte/build/client/_app/immutable';
          const hasReview=readdirSync(assets,{recursive:true}).filter(p=>p.endsWith('.js')).some(p=>readFileSync(`${assets}/${p}`,'utf8').includes('Continue automatically'));
          console.log('AUTOMATIC_REVIEW_ASSET_PRESENT',hasReview);
          if(data.delivery.state.preview.url){
            const url=new URL(data.delivery.state.preview.url);url.pathname=data.delivery.state.brief.routes[0]??'/';
            const entry=await fetch(`http://127.0.0.1:5289${url.pathname}${url.search}`,{headers:{host:url.host},redirect:'manual'});
            const location=entry.headers.get('location');const clean=new URL(url);clean.searchParams.delete('__sr_grant');
            console.log('FEATURE_GATEWAY_REDIRECT',JSON.stringify({status:entry.status,path:location,correct:location===`${clean.pathname}${clean.search}`}));
            if(entry.status===303 && location===`${clean.pathname}${clean.search}`){
              const cookie=entry.headers.get('set-cookie')?.split(';')[0];
              const feature=await fetch(`http://127.0.0.1:5289${location}`,{headers:{host:url.host,cookie},redirect:'manual'});
              console.log('FEATURE_GATEWAY_PAGE_HTTP',feature.status);await feature.body?.cancel();
            }
            await entry.body?.cancel();
          }
          console.log('PREVIEW_DETAIL',JSON.stringify({buildId:id,title:data.build.title,status:data.build.status,preview:data.delivery.state.preview,cycle:data.delivery.state.cycle,routes:data.delivery.state.brief.routes,iterations:progress.iterations.map(i=>({number:i.number,status:i.status,evaluation:i.evaluation,nextSteps:i.nextSteps}))}));
          console.log('PROGRESS_VERIFIED',JSON.stringify({buildId:id,model:data.build.modelId,status:data.build.status,totalTokens:progress.totalTokens,outputTokens:progress.outputTokens,iterations:progress.iterations.map(i=>({number:i.number,status:i.status,outputTokens:i.outputTokens,hasGoal:!!i.goals,hasAssessment:!!i.evaluation}))}));
          const logs=await fetch(`http://127.0.0.1:4173/api/jkai/builds/${id}/logs`,{headers,redirect:'manual'});
          console.log('OWNER_LOGS_HTTP',logs.status);
          if(logs.ok){const body=await logs.json();console.log('LOG_REPLAY',JSON.stringify({rows:body.logs.length,cursor:body.cursor,latest:body.logs.at(-1)?.createdAt})); console.log('RECENT_LOGS',JSON.stringify(body.logs.slice(-25).map(l=>({type:l.type,content:l.content?.slice(-2500),createdAt:l.createdAt}))));}else await logs.body?.cancel();
          const anon=await fetch(`http://127.0.0.1:4173/api/jkai/builds/${id}/logs`,{headers:{host:'strangeramblings.com','x-forwarded-proto':'https'},redirect:'manual'});console.log('ANONYMOUS_LOGS_HTTP',anon.status);await anon.body?.cancel();
          const stream=await fetch(`http://127.0.0.1:4173/api/jkai/builds/${id}/stream`,{headers,signal:AbortSignal.timeout(35000)});console.log('OWNER_STREAM',stream.status,stream.headers.get('content-type'),stream.headers.get('cache-control'));await stream.body?.cancel();
          }
          await client.query('rollback');await client.end();
          NODE
          systemctl show jkai-builder -p RestrictNamespaces -p ActiveState -p SubState -p MainPID -p ActiveEnterTimestamp
          readlink -f /opt/strange-rambling-svelte/build
          cat /opt/strange-rambling-svelte/build/.deploy-sha
          readlink -f /opt/strange-rambling-svelte/builder-releases/pending
          if cmp -s /opt/strange-rambling-svelte/builder-releases/pending/start.js /opt/strange-rambling-svelte/packages/jkai-builder/dist/start.js; then echo BUILDER_PENDING_IS_ACTIVE; else echo BUILDER_UPDATE_WAITING; fi
          docker inspect --format '{{.Name}} {{.State.Status}} {{.State.StartedAt}}' sr-development-broker-1 sr-development-gateway-1
