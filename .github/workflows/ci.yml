name: Development diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  development-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, srmain]
    timeout-minutes: 5
    steps:
      - name: Read build state (encrypted output)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cat > "$work/cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDIzCCAgugAwIBAgIUWVOzBQan52dLDVWRkQIJlYOtRlswDQYJKoZIhvcNAQEL
          BQAwITEfMB0GA1UEAwwWbG9jYWwtYnVpbGQtZGlhZ25vc3RpYzAeFw0yNjA5MDcx
