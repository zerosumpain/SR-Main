name: CI

# Gate and build release candidates on disposable GitHub-hosted runners; promote
# or rebuild on the separate builder; deploy on the VPS. Splitting them is
# deliberate:
#
#  - PR code belongs in a disposable VM, never on either self-hosted machine.
#    This public repository's hosted runner can package the measured ~5.3GB
#    build, and the build needs only public bundle variables, not secrets.
#  - The PR artifact is content-addressed by Git tree. Master promotes it only
#    after verifying the source tree, production public-env hash, and successful
#    gate. Otherwise porkserv performs the known-safe fresh-build fallback.
#  - The VPS only downloads, stages and atomically selects a verified payload.
#
# `needs: gate` is what enforces the gate at the workflow level: a red gate
# cannot reach the deploy job regardless of anything configured server-side.
#
# The long-standing note here claimed required status checks were unavailable
# on this plan because "the branch-protection and rulesets APIs both 403". That
# was wrong, and worth correcting because a lot of defensive design was built on
# it. Neither API 403s: branch-protection returns 404 ("Branch not protected")
# and rulesets returns an empty array, which mean "none configured", not
# "forbidden". Creating an active ruleset with a required_status_checks rule
# against master succeeds on this repo — verified by creating one and deleting
# it again. Only `enforcement: evaluate` is gated (that one needs Enterprise).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys touch the VPS at once. Master cannot be cancelled in
# progress; superseded PR runs can and should be.
#
# KEY IT ON THE REF. A single global group put every pull-request gate in the
# same queue as the production deploy, and with cancel-in-progress: false
# GitHub keeps only ONE run pending per group — a newly queued run cancels the
# one already waiting. So opening a PR while a master deploy sat in the queue
# cancelled the deploy. On 2026-08-11 that silently stranded the Apple Calendar
# merge: the run was cancelled before a single job started, master said merged,
# and production stayed on the previous commit.
#
# Per-ref keeps the property that actually matters — only master runs prebuild
# and release, so master's own group is still the one lane into the VPS — while
# PR gates, which touch nothing, stop evicting it. It also stops PRs queueing
# behind each other for no reason.
concurrency:
  group: sr-main-deploy-${{ github.ref }}
  # Superseded PR commits only consume hosted-runner slots and delay the commit
  # anyone can still merge. Master is different: cancelling a release midway
  # can strand a staged build, so production runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # ── the cheap classifier every expensive job hangs off ────────────────────────
  #
  # This was three steps at the top of one big gate job. It is its own job now
  # because the type check, the tests and the build run in PARALLEL and all three
  # need the answer. One classification, one source of truth: three jobs each
  # running the classifier could in principle disagree, and a gate whose skips
  # disagree with each other is a gate nobody can reason about.
  #
  # It costs ~12s of serial time at the head of the run. That buys back far more
  # than it spends, and it is the only serial hop in the new shape.
  level:
    name: Gate level
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      level: ${{ steps.level.outputs.level }}
      shards: ${{ steps.level.outputs.shards }}
      candidate_certified: ${{ steps.candidate.outputs.certified }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      candidate_name: ${{ steps.candidate.outputs.name }}
    steps:
      # Enough history to diff against a base, and no more. `fetch-depth: 0`
      # would be the obvious choice and is the wrong one: a full clone costs
      # ~10-20s on EVERY run, to enable a shortcut that fires on 3% of them.
      #
      # A small depth is sufficient because both classifiers only ever need the
      # immediate base. On a pull_request the checked-out ref is the merge
      # commit, whose FIRST PARENT is the base branch tip; on a push it is the
      # new master tip, whose first parent is the previous one. `HEAD^` is the
      # base in both cases, so neither classifier needs origin/master at all.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 5

      # The blast-radius axis. See scripts/gate-level.sh for why this is a
      # second axis rather than a third value on the risk tier.
      #
      # EVERY skip downstream is written as `!= 'L1'`, never `== 'L2'`. If this
      # job fails the level is empty — and an empty string is `!= 'L1'`, so every
      # expensive job still runs. The failure direction is a full gate, which
      # costs time rather than safety. Written the other way round, an
      # unrecognised level would silently skip the tests and the build while the
      # run still reported success.
      - name: Classify gate level
        id: level
        run: |
          ./scripts/gate-level.sh HEAD^ | tee /tmp/level.txt
          LEVEL="$(sed -n 's/^level=//p' /tmp/level.txt)"

          # Same polarity as the skips. Shard the suite four ways unless the
          # level is EXACTLY L2, where the run is already scoped to a few dozen
          # files and splitting it four ways would pay four job set-ups to save
          # nothing. Empty or unrecognised takes the expensive path.
          if [ "$LEVEL" = "L2" ]; then SHARDS='[1]'; else SHARDS='[1,2,3,4]'; fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS"

          {
            echo "### Gate level: \`$LEVEL\`"
            echo ""
            echo "$(sed -n 's/^reason=//p' /tmp/level.txt)"
            echo ""
            echo "Test shards: \`$SHARDS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs at EVERY level — these ARE the whole gate for a documentation-only
      # change, so they must not sit behind an `if`.
      #
      # No setup-node and no `npm ci`: every linter here imports nothing but
      # `node:fs` (and `node:child_process` for `git ls-files`), so the runner's
      # preinstalled Node is enough. That is what makes an L1 gate ~25s instead
      # of ~40s, and it is a constraint on anything added to this line: give one
      # of them a dependency and it silently drops out of the L1 gate. They ran
      # on Node 22 before this split and run on the image default now; all five
      # only read files and compare strings, and any incompatibility would be a
      # loud red gate rather than a silent pass.
      #
      # gate:schema-imports was in the local `npm run gate` chain but had never
      # been wired in here, so the one check standing between a `$lib` import in
      # schema.ts and a drizzle push that fails while the release reports success
      # only ever ran on a laptop. Added 2026-08-27.
      - name: Lint gates
        run: ./scripts/gate-structural.sh

      # A squash merge has a new commit SHA but, when it contains exactly the
      # gated PR content, the same Git TREE. Find a candidate by that immutable
      # content id and accept it only when the Gate job in its own PR run passed.
      # A direct push, red PR, expired artifact or API failure emits no
      # certificate, which makes master run the full checks and fresh build.
      - name: Find a gate-certified release candidate
        id: candidate
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tree = require('child_process')
              .execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' })
              .trim();
            const name = `candidate-${tree}`;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100 }
            );
            for (const artifact of artifacts.sort((a, b) => b.id - a.id)) {
              if (artifact.expired || !artifact.workflow_run?.id) continue;
              const runId = artifact.workflow_run.id;
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: runId
              });
              if (run.data.event !== 'pull_request') continue;
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100 }
              );
              const gate = jobs.find((job) => job.name === 'Gate (check + test)');
              if (gate?.conclusion !== 'success') continue;
              core.setOutput('certified', 'true');
              core.setOutput('run_id', String(runId));
              core.setOutput('name', name);
              core.summary.addRaw(`Reusing gate-certified candidate \`${name}\` from run ${runId}.`);
              await core.summary.write();
              return;
            }
            core.setOutput('certified', 'false');
            core.notice(`No green PR candidate found for tree ${tree}; master will run the full fallback path.`);

  # ── the type check ───────────────────────────────────────────────────────────
  #
  # NEVER SCOPED within a source gate. A changed type signature breaks its
  # consumers, not itself, so narrowing it would miss exactly what it exists to
  # catch. A master run may reuse the completed result for the exact gated tree.
  #
  # Measured at ~94s in CI (from L2 runs, where the test half is scoped down to a
  # few dozen files and the pair's wall clock is therefore this job alone). That
  # makes it the floor of the whole gate: no amount of test sharding takes the
  # gate below it.
  typecheck:
    name: Type check
    needs: level
    if: needs.level.outputs.level != 'L1' && needs.level.outputs.candidate_certified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Must exist at `svelte-kit sync` time: SvelteKit generates
      # `$env/static/public` from the environment, so without it the module has
      # no members and jkai/+layout.svelte fails to type-check ("has no exported
      # member"). It is the ONLY statically-imported env var.
      #
      # DELIBERATELY PER-JOB, never at workflow level. `prebuild` INLINES this
      # value into the production bundle, and a process env var beats the .env it
      # reads — hoisting this placeholder up one level would ship
      # `ci-gate-placeholder` to production and silently break web push.
      PUBLIC_VAPID_PUBLIC_KEY: ci-gate-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The dependency audit compares the candidate with its base. On pull
          # requests HEAD is the synthetic merge commit and HEAD^ is the base;
          # on pushes HEAD^ is the previous master tip.
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        # Dependency changes must pass the live advisory service. An unchanged
        # manifest/lockfile has the same production graph as the already-gated
        # base, so do not let an npm advisory-service outage block unrelated
        # application or deployment fixes. The nightly workflow still audits
        # the graph for advisories disclosed after it entered master.
        run: |
          if git diff --quiet HEAD^ -- package.json package-lock.json; then
            echo "Production dependency graph unchanged; retaining the base audit result."
            exit 0
          fi

          status=1
          for attempt in 1 2 3; do
            echo "Audit attempt $attempt/3"
            if timeout 60 npm audit --omit=dev --audit-level=high; then
              exit 0
            else
              status=$?
            fi
          done
          exit "$status"

      - name: Type check
        run: ./scripts/gate-check.sh

  # ── the tests, sharded ───────────────────────────────────────────────────────
  #
  # The suite was the gate's long pole: ~169s, of which only ~54s is running
  # assertions. The other ~115s is module import — vitest re-evaluates the
  # first-party `$lib` graph once per isolated test file, 593 times, and 298s of
  # import CPU squeezed into a 169s wall means the runner is already saturated.
  #
  # Three cheaper-looking fixes were measured and rejected before reaching for
  # more machines:
  #   --no-isolate       47% faster and UNSAFE here. With a shared module
  #                      registry `vi.mock` can silently fail to apply, so a test
  #                      passes against the real module. ~112 files mock modules
  #                      they never import.
  #   --pool=threads     within noise.
  #   deps.optimizer     within noise — the cost is first-party `$lib`, not
  #                      node_modules, which is all the optimizer pre-bundles.
  #
  # So: spend runners. This repo is PUBLIC, standard runners are free, and
  # everything expensive used to be crammed into one of them. Sharding raises
  # TOTAL cpu — each shard re-imports its own graph — and cuts wall clock, which
  # is the trade a free runner pool makes worth taking.
  #
  # Four shards, not two: the suite grew 466 -> 593 files in eleven days, and the
  # shard count is the dial that keeps the test leg under the type check's ~94s
  # floor as it keeps growing.
  test:
    name: Tests
    needs: level
    if: needs.level.outputs.level != 'L1' && needs.level.outputs.candidate_certified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every failing shard rather than cancelling the others on the first
      # red. The aggregate result is `failure` either way, so this costs nothing
      # and turns one failure report into all of them.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.level.outputs.shards) }}
    env:
      DATABASE_URL: postgresql://app:test@localhost:5432/strange_rambling
      # stealth-scrape refuses to run anywhere but homeserv (a datacenter IP
      # defeats the point of stealth scraping), so its tests only pass there.
      # This is the documented escape hatch. Safe in the gate: the tests mock
      # `runScrape`, so nothing is actually scraped — the flag only stops the
      # host guard short-circuiting before the mock is reached.
      SCRAPER_ALLOW_NON_HOMESERV: '1'
      # See the note in `typecheck`. Per-job, deliberately.
      PUBLIC_VAPID_PUBLIC_KEY: ci-gate-placeholder
    steps:
      # Postgres starts FIRST and in the BACKGROUND, before the checkout, so the
      # image pull and boot overlap the install that follows.
      #
      # EVERY shard gets one. Exactly one test file reaches a real Postgres
      # (tests/lib/integrations/credentials.test.ts) and it has NO skip guard —
      # its beforeEach deletes rows unconditionally — but which shard that file
      # lands in is an implementation detail of vitest's file ordering. Pinning it
      # to shard 1 would be a silent trap the first time the ordering changed.
      # The container costs ~0 wall clock because it boots under `npm ci`.
      #
      # pgvector, not plain postgres: the schema declares vector() columns and
      # drizzle-kit push fails without the extension.
      - name: Start Postgres in the background
        run: |
          nohup docker run --rm --name ci-postgres \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=strange_rambling \
            -p 5432:5432 \
            pgvector/pgvector:pg16 > /tmp/ci-postgres.log 2>&1 &
          echo "postgres pulling/booting in the background; waited on before the schema push"

      # Depth 5, not 1: at L2 the selector diffs HEAD^ to decide which files the
      # change can reach.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install isolated handler runner
        run: ./scripts/check-authored-runner.sh

      - run: npm ci

      # `docker exec ... pg_isready` is NOT a sufficient readiness test, and
      # using it turned master red on run 31339327336: the step reported
      # "postgres ready after 8s" and the very next command died with "server
      # closed the connection unexpectedly".
      #
      # The postgres image runs a TEMPORARY server during initdb so that init
      # scripts can run against it. pg_isready happily succeeds against that
      # server; it is then shut down and restarted for real, and any client
      # connected in the gap is dropped.
      #
      # Poll the condition the next step actually needs — a query, through the
      # published port, over the same URL the tests use.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 90); do
            if psql "$DATABASE_URL" -c 'select 1' >/dev/null 2>&1; then
              echo "postgres accepting queries after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept a query within 90s"
          docker logs ci-postgres 2>&1 | tail -40 || true
          cat /tmp/ci-postgres.log 2>/dev/null | tail -40 || true
          exit 1

      - name: Prepare test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          CI=1 FORCE_COLOR=0 npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Tests
        run: ./scripts/gate-test-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}"
        env:
          GATE_LEVEL: ${{ needs.level.outputs.level }}
          GATE_BASE: HEAD^

      - name: Memory and evidence database contracts
        if: matrix.shard == 1
        run: npx vitest run src/lib/jkai/memory/service.integration.test.ts src/lib/jkai/grounding/evidence.integration.test.ts src/lib/daydream/memory-consolidation.integration.test.ts

  # ── the build ────────────────────────────────────────────────────────────────
  #
  # The PR build is also a release candidate. It carries the real adapter and is
  # keyed by Git tree rather than commit SHA, allowing a squash-merge commit with
  # identical content to promote it. Master verifies the tree, the gate result,
  # and a hash of the build-time public environment before reuse.
  build:
    name: Build
    needs: level
    if: github.event_name == 'pull_request' && needs.level.outputs.level != 'L1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm

      - run: npm ci

      - name: Provide build-time public env
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          {
            echo "PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://strangeramblings.com}"
            echo "PUBLIC_VAPID_PUBLIC_KEY=${PUBLIC_VAPID_PUBLIC_KEY:-ci-gate-placeholder}"
          } > .env

      - name: Build the real release candidate
        run: npm run gate:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify and stamp the candidate
        run: ./scripts/ci-prebuild.sh

      - name: Build candidate sidecars
        run: npm run build:release-sidecars

      - name: Identify source tree
        id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ steps.source.outputs.tree }}
          path: |
            build/
            packages/jkai-builder/dist/start.js
            packages/jkai-codex-bridge/dist/start.js
            packages/jkai-wa-worker/dist/start.js
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  # ── the verdict ──────────────────────────────────────────────────────────────
  #
  # THE NAME OF THIS JOB IS LOAD-BEARING. `Gate (check + test)` is the context
  # named by the required-status-check ruleset on master (id 20615626) and by
  # `needs: gate` on release and auto-merge. Splitting one job into four kept that
  # name here precisely so neither the ruleset nor the deploy wiring had to change
  # — rename it and master silently stops requiring a gate at all.
  #
  # `!cancelled()` rather than `always()`. `always()` is true for a CANCELLED run
  # too, and `release` deliberately avoids it for that reason: a cancelled run
  # that still produced a green gate would turn cancel into a no-op on the one job
  # that touches production.
  gate:
    name: Gate (check + test)
    needs: [level, typecheck, test, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          LEVEL: ${{ needs.level.outputs.level }}
          R_LEVEL: ${{ needs.level.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          EVENT: ${{ github.event_name }}
          CERTIFIED: ${{ needs.level.outputs.candidate_certified }}
        run: |
          FAIL=0

          # The classifier must have succeeded. Every skip below is justified by
          # its output, and an empty level means none of them can be trusted.
          if [ "$R_LEVEL" != "success" ]; then
            echo "::error::gate level job did not succeed (result=$R_LEVEL)"
            FAIL=1
          fi

          # ALLOW-LIST, not a deny-list. A result passes only if it is `success`
          # or a skip this workflow actually asked for. `failure`, `cancelled`,
          # and anything GitHub invents later all fall through to red.
          #
          # Written the other way round — "fail if result == failure" — a
          # cancelled shard or an unrecognised state would read as a passing
          # gate. That is the single failure this job exists to prevent, and it
          # is the same polarity trap as `!= 'L1'` elsewhere in this file.
          require() {
            case "$2" in
              success) echo "  $1: success" ;;
              skipped)
                if [ "$3" = "yes" ]; then
                  echo "  $1: skipped (expected at this level)"
                else
                  echo "::error::$1 was skipped, but this level requires it"
                  FAIL=1
                fi
                ;;
              *) echo "::error::$1: $2"; FAIL=1 ;;
            esac
          }

          # L1 is documentation only — the two linters in the level job ARE the
          # gate, and they already ran unconditionally.
          if [ "$LEVEL" = "L1" ] || [ "$CERTIFIED" = "true" ]; then SKIP_OK=yes; else SKIP_OK=no; fi
          require "type check" "$R_TYPECHECK" "$SKIP_OK"
          require "tests"      "$R_TEST"      "$SKIP_OK"

          # PR documentation changes have no candidate build. Master builds or
          # promotes in prebuild, so it never needs this separate proof job.
          if [ "$LEVEL" = "L1" ] || [ "$EVENT" != "pull_request" ]; then
            BUILD_SKIP_OK=yes
          else
            BUILD_SKIP_OK=no
          fi
          require "build" "$R_BUILD" "$BUILD_SKIP_OK"

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "==> GATE FAILED (level=${LEVEL:-<unset>})"
            exit 1
          fi
          echo "==> gate passed (level=${LEVEL:-<unset>})"

  # Building is ~160s of work nobody is waiting on, and it used to sit behind the
  # gate purely because it shared a job with the ship. It does not need the
  # gate's verdict: nothing it does is visible to production. Staging a release
  # directory is inert until the `release` job flips a symlink at it, and that
  # job does depend on a green gate.
  #
  # The ref guard is identical to `release`'s, so already-merged master code is
  # the only thing that ever executes here. That guard, not the gate, is what
  # keeps PR code off the production box — `npm ci` runs arbitrary lifecycle
  # scripts and the gate never inspected them anyway.
  prebuild:
    name: Prebuild (porkserv)
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    # porkserv, not the VPS. This job used to run `npm ci` and a 6GB-heap build
    # on the box that serves strangeramblings.com, so every deploy was a memory
    # and disk spike on production — which is how a full VPS disk took CI down
    # with "runner lost communication". porkserv has 64GB and ~300GB spare and
    # serves nothing.
    #
    # SR-MAIN IS A PUBLIC REPO. This runner may only ever run jobs carrying the
    # master guard above. A job that also ran on `pull_request` would let any
    # stranger open a PR and execute arbitrary code on that box, so `gate` must
    # never be pointed at it — and gate is free on GitHub-hosted anyway.
    needs: level
    runs-on: [self-hosted, builder]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Runtime versions
        run: node --version && npm --version

      # `$env/static/public` values are INLINED INTO THE BUNDLE at build time,
      # and the runner's checkout has no .env — so without this the production
      # build ships an empty PUBLIC_VAPID_PUBLIC_KEY and web push silently
      # breaks.
      #
      # This used to be grepped out of /opt/strange-rambling-svelte/.env, which
      # only worked while the job ran on the VPS. Repository variables replace
      # it. Nothing private moves: PUBLIC_SITE_URL is the site's own address and
      # the VAPID *public* key already ships inside a bundle anyone can
      # download. Everything private is still read at runtime from the
      # service's EnvironmentFile.
      - name: Provide build-time public env
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          # Fail loudly rather than ship a release whose push notifications are
          # quietly dead. A silent empty key is the exact fault guarded here,
          # and an unset repository variable expands to an empty string.
          if [ -z "$PUBLIC_VAPID_PUBLIC_KEY" ]; then
            echo "::error::repository variable PUBLIC_VAPID_PUBLIC_KEY is unset — refusing to build a release with web push broken"
            exit 1
          fi
          {
            echo "PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://strangeramblings.com}"
            echo "PUBLIC_VAPID_PUBLIC_KEY=$PUBLIC_VAPID_PUBLIC_KEY"
          } > .env
          echo "public vars provided: $(grep -c '^PUBLIC_' .env)"

      - name: Download the gate-certified candidate
        id: candidate_download
        if: needs.level.outputs.candidate_certified == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.level.outputs.candidate_name }}
          run-id: ${{ needs.level.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .

      - name: Verify and promote the candidate
        id: promote
        if: needs.level.outputs.candidate_certified == 'true'
        run: ./scripts/ci-promote-candidate.sh

      - name: Install dependencies for a fresh build
        if: steps.promote.outputs.promoted != 'true'
        run: npm ci

      # The real adapter. A candidate promotion skips this; every fallback build
      # still produces the complete runnable server bundle.
      - name: Build
        if: steps.promote.outputs.promoted != 'true'
        run: npm run gate:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Verification belongs on the build machine: check-built-extract.mjs
      # imports the BUILT server chunks, which import from node_modules. Run in
      # the release job it failed with "Cannot find package 'marked'", because
      # that job has no node_modules by design. It also stamps
      # build/.deploy-sha, so this must precede the upload.
      - name: Verify and stamp the build
        if: steps.promote.outputs.promoted != 'true'
        run: ./scripts/ci-prebuild.sh

      # Every bundle is built HERE, because this is now the only job with
      # node_modules. The staging scripts on the VPS consume these instead of
      # building their own.
      #
      # A release candidate is one coherent set. Retaining an older sidecar
      # here would make the artifact a combination that no gate ever tested.
      - name: Build the sidecar bundles
        if: steps.promote.outputs.promoted != 'true'
        run: npm run build:release-sidecars

      # One artifact carries everything the VPS needs. Deliberately routed
      # through GitHub rather than rsynced porkserv -> VPS: it keeps the number
      # of write paths into production at exactly one, the release job, and
      # needs no inbound credential on the VPS for a second machine.
      - name: Upload the release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            build/
            packages/jkai-builder/dist/start.js
            packages/jkai-codex-bridge/dist/start.js
            packages/jkai-wa-worker/dist/start.js
          retention-days: 1
          if-no-files-found: error
          # build/.deploy-sha is a dotfile and upload-artifact drops hidden
          # files unless told otherwise — silently, with only a warning.
          include-hidden-files: true


  release:
    name: Release (VPS)
    # A SKIP ANYWHERE UPSTREAM SKIPS THIS JOB, and that is not obvious from
    # `needs` alone. GitHub propagates `skipped` down the needs graph: a job runs
    # only if every job it needs succeeded, and a job that itself only ran
    # because of `always()` / `!cancelled()` does NOT clear the skip for its own
    # dependents. `gate` needs `build`, and `build` is deliberately skipped on a
    # master push — so with plain `needs` this job silently stopped deploying the
    # moment the gate was split into parallel jobs. Merged, green, and never
    # shipped, which is the exact failure mode this repo has been bitten by
    # before. Seen for real on run 32469500847.
    #
    # So the dependency contract is written out rather than implied: the results
    # are asserted explicitly, which is immune to a skip appearing anywhere in
    # the graph in future.
    #
    # `!cancelled()` and NOT `always()`. always() is true for a cancelled run
    # too, which would turn cancel into a no-op on the one job that touches
    # production — that was the original reason for avoiding it and it still
    # holds. This keeps the property while dropping the accidental one.
    needs: [gate, prebuild]
    # The ref guard is on BOTH arms, deliberately. It used to sit only on the push arm, which
    # meant `gh workflow run CI --ref <any-branch>` deployed that branch straight to
    # production — the same class of unsanctioned deploy path that once replaced production
    # configuration with a laptop's and cost 33 hours. Dispatch stays available as the manual
    # re-trigger for when GitHub does not fire the push event, but it can only ever ship master.
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.prebuild.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: [self-hosted, srmain]
    timeout-minutes: 25
    steps:
      # Full history: scripts/ci-release.sh records the release log by diffing
      # the previously-deployed sha against HEAD, and the default depth-1
      # checkout has no such commit to diff against. The self-hosted runner
      # reuses its workspace, so this is a one-off cost rather than a full clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Where the build lands now that it happens on porkserv. Extracts to the
      # workspace root, restoring build/ and the sidecar bundles exactly where
      # the staging scripts already expect to find them.
      - name: Download the release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}

      # Placing the build on the VPS is all this does — verification and
      # stamping happened in prebuild, on the machine with node_modules. It
      # asserts the artifact's stamp matches this checkout before staging.
      - name: Stage the release
        run: ./scripts/ci-stage-release.sh

      # No setup-node and, deliberately, no `npm ci`. Nothing this job runs
      # needs node_modules: the release-log ingest imports only node: builtins
      # and its own siblings, drizzle-kit is installed into VPS_DIR by the
      # script itself, and the build it ships was packaged by prebuild. Note
      # this workspace no longer inherits node_modules from prebuild either,
      # since prebuild runs on a different machine.
      # Staging must PRECEDE the release, because ci-release.sh ends by running
      # ci-apply-sidecars.sh, and apply only ever looks for a bundle staged for
      # THIS sha. These two steps used to sit after it — so every deploy applied
      # nothing ("nothing staged for <sha> — leaving it as it is"), then staged a
      # bundle the next run would not look for either. jkai-wa-worker and
      # jkai-codex-bridge ran 2026-08-25 code for three days while each deploy
      # reported success; the fix that could not reach WhatsApp is what surfaced
      # it. Ordering is pinned by tests/scripts/ci-sidecars.test.ts.
      #
      # They build nothing — the bundles arrived in the release artifact, and
      # this job has no node_modules. Staging is strict: a candidate missing a
      # promised bundle must stop before the web symlink moves.
      - name: Stage the systemd sidecars
        run: ./scripts/ci-stage-sidecars.sh

      - name: Stage the jkai-builder sidecar
        run: ./scripts/ci-stage-builder.sh

      # The browser sidecar is Docker-based rather than a bundled systemd unit.
      # Prepare its image and shared credential before the web restart, but do
      # not replace the old container until the matching application is live.
      - name: Prepare the Webframe sidecar
        run: ./scripts/ci-webframe.sh prepare

      - name: Release
        run: ./scripts/ci-release.sh

      - name: Activate the Webframe sidecar
        run: ./scripts/ci-webframe.sh activate

  risk-tier:
    name: Risk tier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      # Full history: the classifier diffs against the MERGE BASE, so it judges
      # what this PR adds rather than everything that landed on master since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: classify
        run: ./scripts/classify-pr-risk.sh origin/${{ github.base_ref }}

      # Deliberately never fails. A high tier is a normal, expected outcome
      # (any change to auth or schema is high) — it means "a human looks at
      # this", not "this is broken". Failing here would block legitimate work.
      #
      # `matched` is a list of filenames taken from the PR, i.e. attacker-
      # controlled text, and Actions expands `${{ }}` into the script body
      # BEFORE bash parses it. Interpolated inline (as this step used to be), a
      # PR adding a file whose name contains a quote or a backtick gets shell
      # execution on the runner. Passing both values through `env:` and
      # referencing them as ordinary variables removes the expansion entirely.
      - name: Summarise
        env:
          TIER: ${{ steps.classify.outputs.tier }}
          MATCHED: ${{ steps.classify.outputs.matched }}
        run: |
          {
            echo "## Risk tier: \`$TIER\`"
            if [ "$TIER" = "high" ]; then
              echo "Touches protected paths — **will not auto-merge**, needs a human."
              echo '```'
              echo "$MATCHED"
              echo '```'
            else
              echo "No protected paths touched — eligible for auto-merge from an \`agent/\` branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Auto-merge (low tier, agent branches)
    needs: [gate, risk-tier]
    # Draft PRs are skipped, not attempted. A failed build rescues its work into
    # a DRAFT pull request (`rescueFailedGitBuild`), which GitHub refuses to
    # merge — `GraphQL: Pull Request is still a draft (mergePullRequest)`. This
    # job used to try anyway and go red, stamping a false failure onto work that
    # had actually passed the gate (seen on #234, whose gate was green). Note
    # that `on: pull_request` does not include `ready_for_review`, so marking a
    # rescue PR ready does not re-run this job — un-drafted rescues are merged
    # by hand on purpose.
    #
    # `needs.gate.result` is asserted for the same reason as on `release`: an L1
    # pull request skips `build`, that skip propagates through `gate`, and with
    # plain `needs` this job would quietly stop merging documentation-only agent
    # branches. risk-tier needs no such assertion — if it fails or is skipped its
    # `tier` output is empty, which is already not 'low'.
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.risk-tier.outputs.tier == 'low' &&
      startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `gh pr merge --delete-branch` shells out to git to drop the local
      # branch, so without a checkout it dies on "not a git repository" before
      # merging anything. Cheap to add and keeps --delete-branch working.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Merge if a token is configured
        env:
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${AUTOMERGE_TOKEN:-}" ]; then
            echo "AUTOMERGE_TOKEN is not set — leaving PR #$PR for manual merge."
            echo
            echo "Why a PAT rather than the built-in GITHUB_TOKEN: a push made with"
            echo "GITHUB_TOKEN does NOT trigger further workflow runs, so merging with"
            echo "it would land the change on master and never fire the deploy job."
            echo "Set AUTOMERGE_TOKEN to a fine-grained PAT scoped to this repo with"
            echo "contents:write + pull_requests:write to complete the loop."
            exit 0
          fi
          GH_TOKEN="$AUTOMERGE_TOKEN" gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          echo "Merged PR #$PR (tier=low, agent branch)."
