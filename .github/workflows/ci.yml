name: CI

# Gate on a GitHub-hosted runner; build + deploy on the self-hosted runner that
# lives ON the VPS. Splitting them is deliberate:
#
#  - The gate runs untrusted-ish PR code, so it belongs in a disposable hosted
#    VM, never on the production box. It needs no secrets (only one test file
#    touches a DB, and it skips without one), so a hosted runner is enough.
#  - The build does NOT fit a hosted runner: it peaks at ~5.3GB RSS (measured
#    2026-07-25), and private-repo hosted runners are 2-core/7GB. It runs on the
#    VPS instead, which builds where it deploys — no artifact transfer and no
#    SSH deploy key in GitHub secrets. The runner unit is capped at MemoryMax=7G
#    so a runaway build is cgroup-killed instead of the kernel OOM-killer
#    picking the production node process.
#
# `needs: gate` is what actually enforces the gate: SR-Main is private on
# GitHub Free, so required status checks are unavailable (the branch-protection
# and rulesets APIs both 403). A red gate cannot reach the deploy job regardless.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys touch the VPS at once. Do not cancel in progress: a
# half-finished deploy is worse than a queued one.
concurrency:
  group: sr-main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate (check + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://app:test@localhost:5432/strange_rambling
      # stealth-scrape refuses to run anywhere but homeserv (a datacenter IP
      # defeats the point of stealth scraping), so its tests only pass there.
      # This is the documented escape hatch. Safe in the gate: the tests mock
      # `runScrape`, so nothing is actually scraped — the flag only stops the
      # host guard short-circuiting before the mock is reached.
      SCRAPER_ALLOW_NON_HOMESERV: '1'
      # Must exist at `svelte-kit sync` time, which BOTH the type check and the
      # build trigger: SvelteKit generates `$env/static/public` from the
      # environment, so without it the module has no members and
      # jkai/+layout.svelte fails to type-check ("has no exported member"). It
      # is the ONLY statically-imported env var. A placeholder is correct here —
      # the gate never serves push notifications, and the real value is inlined
      # by the deploy job below.
      PUBLIC_VAPID_PUBLIC_KEY: ci-gate-placeholder

    steps:
      # Postgres starts FIRST and in the BACKGROUND, before the checkout.
      #
      # It used to be a `services:` block, which GitHub initialises before the
      # first step — measured at 23s of dead time, serialised ahead of the
      # checkout and `npm ci` that do not need it. Started here, the image pull
      # and boot overlap the ~29s of install that follows, and the wait happens
      # where the database is actually first needed.
      #
      # pgvector, not plain postgres: the schema declares vector() columns and
      # drizzle-kit push fails without the extension. Throwaway either way — the
      # gate never touches the production DB.
      - name: Start Postgres in the background
        run: |
          nohup docker run --rm --name ci-postgres \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=strange_rambling \
            -p 5432:5432 \
            pgvector/pgvector:pg16 > /tmp/ci-postgres.log 2>&1 &
          echo "postgres pulling/booting in the background; waited on before the schema push"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 90); do
            if docker exec ci-postgres pg_isready -U app -q 2>/dev/null; then
              echo "postgres ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready within 90s"
          docker logs ci-postgres 2>&1 | tail -40 || true
          cat /tmp/ci-postgres.log 2>/dev/null | tail -40 || true
          exit 1

      # The database is here for the schema push, not for the tests. Exactly one
      # test file reaches a real Postgres (tests/lib/integrations/credentials.test.ts)
      # and — contrary to what this comment used to claim — it has NO skip guard:
      # its beforeEach deletes rows unconditionally, so it hard-fails without a
      # database rather than skipping. Anyone reasoning about removing the
      # container needs both facts.
      - name: Prepare test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          CI=1 FORCE_COLOR=0 npx drizzle-kit push --config=drizzle.config.ts --force

      # Cheap and near-instant (~0.4s for the pair), so they run first and fail
      # fast before anything expensive starts.
      - name: Lint gates
        run: npm run gate:public-routes && npm run gate:font-sizes

      # svelte-check and vitest, concurrently. See scripts/gate-concurrent.sh for
      # why the exit-code handling in there is written the long way round.
      - name: Type check + tests
        run: ./scripts/gate-concurrent.sh

      # The build is a PROOF here, not an artifact — the gate deletes it. On a
      # master push that proof is redundant: the VPS rebuilds the identical tree
      # minutes later in the deploy job, and its Build step runs BEFORE
      # ci-deploy.sh, whose first write to production is an rsync. A broken build
      # therefore fails the deploy with production untouched.
      #
      # The guard is `!= push`, deliberately, so that a workflow_dispatch re-run
      # still builds. Writing it as `== pull_request` would leave a manual
      # dispatch with no build check from EITHER job.
      #
      # SR_GATE_STUB_ADAPTER swaps adapter-node for a no-op, cutting ~93s. The
      # bundle is still built and checked — only the packaging of a server
      # bundle nobody reads is skipped. See svelte.config.js. Deliberately set
      # here and nowhere else: on the VPS this flag would deploy an empty build.
      - name: Build
        if: github.event_name != 'push'
        run: npm run gate:build
        env:
          SR_GATE_STUB_ADAPTER: '1'

  # Building is ~160s of work nobody is waiting on, and it used to sit behind the
  # gate purely because it shared a job with the ship. It does not need the
  # gate's verdict: nothing it does is visible to production. Staging a release
  # directory is inert until the `release` job flips a symlink at it, and that
  # job does depend on a green gate.
  #
  # The ref guard is identical to `release`'s, so already-merged master code is
  # the only thing that ever executes here. That guard, not the gate, is what
  # keeps PR code off the production box — `npm ci` runs arbitrary lifecycle
  # scripts and the gate never inspected them anyway.
  prebuild:
    name: Prebuild (VPS)
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: [self-hosted, srmain]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runtime versions
        run: node --version && npm --version

      - run: npm ci

      # `$env/static/public` values are INLINED INTO THE BUNDLE at build time,
      # and the runner's checkout has no .env — so without this the production
      # build ships an empty PUBLIC_VAPID_PUBLIC_KEY and web push silently
      # breaks. Copy only the PUBLIC_ lines: everything private is read at
      # runtime from the service's EnvironmentFile, so there is no reason to
      # duplicate secrets into the runner workspace.
      - name: Provide build-time public env
        run: |
          grep -E '^PUBLIC_' /opt/strange-rambling-svelte/.env > .env
          echo "public vars provided: $(grep -c '^PUBLIC_' .env)"

      # The REAL adapter. SR_GATE_STUB_ADAPTER is a gate-only flag and must
      # never reach here — ci-prebuild.sh asserts handler.js exists for exactly
      # that reason.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Stage the release
        run: ./scripts/ci-prebuild.sh

  release:
    name: Release (VPS)
    # Both, and plain `needs:` semantics — the job runs only when BOTH succeed,
    # and is cancelled with the run. Deliberately no `always()`: it returns true
    # even for a cancelled run, which would turn cancel into a no-op on the one
    # job that touches production.
    needs: [gate, prebuild]
    # The ref guard is on BOTH arms, deliberately. It used to sit only on the push arm, which
    # meant `gh workflow run CI --ref <any-branch>` deployed that branch straight to
    # production — the same class of unsanctioned deploy path that once replaced production
    # configuration with a laptop's and cost 33 hours. Dispatch stays available as the manual
    # re-trigger for when GitHub does not fire the push event, but it can only ever ship master.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: [self-hosted, srmain]
    timeout-minutes: 15
    steps:
      # Full history: scripts/ci-release.sh records the release log by diffing
      # the previously-deployed sha against HEAD, and the default depth-1
      # checkout has no such commit to diff against. The self-hosted runner
      # reuses its workspace, so this is a one-off cost rather than a full clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-node and, deliberately, no `npm ci`. Nothing this job runs
      # needs node_modules: the release-log ingest imports only node: builtins
      # and its own siblings, and the build it ships was packaged by prebuild.
      # Skipping the install is most of why the ship is seconds rather than
      # minutes.
      - name: Release
        run: ./scripts/ci-release.sh

  risk-tier:
    name: Risk tier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    steps:
      # Full history: the classifier diffs against the MERGE BASE, so it judges
      # what this PR adds rather than everything that landed on master since.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        run: ./scripts/classify-pr-risk.sh origin/${{ github.base_ref }}

      # Deliberately never fails. A high tier is a normal, expected outcome
      # (any change to auth or schema is high) — it means "a human looks at
      # this", not "this is broken". Failing here would block legitimate work.
      #
      # `matched` is a list of filenames taken from the PR, i.e. attacker-
      # controlled text, and Actions expands `${{ }}` into the script body
      # BEFORE bash parses it. Interpolated inline (as this step used to be), a
      # PR adding a file whose name contains a quote or a backtick gets shell
      # execution on the runner. Passing both values through `env:` and
      # referencing them as ordinary variables removes the expansion entirely.
      - name: Summarise
        env:
          TIER: ${{ steps.classify.outputs.tier }}
          MATCHED: ${{ steps.classify.outputs.matched }}
        run: |
          {
            echo "## Risk tier: \`$TIER\`"
            if [ "$TIER" = "high" ]; then
              echo "Touches protected paths — **will not auto-merge**, needs a human."
              echo '```'
              echo "$MATCHED"
              echo '```'
            else
              echo "No protected paths touched — eligible for auto-merge from an \`agent/\` branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Auto-merge (low tier, agent branches)
    needs: [gate, risk-tier]
    if: >-
      github.event_name == 'pull_request' &&
      needs.risk-tier.outputs.tier == 'low' &&
      startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # `gh pr merge --delete-branch` shells out to git to drop the local
      # branch, so without a checkout it dies on "not a git repository" before
      # merging anything. Cheap to add and keeps --delete-branch working.
      - uses: actions/checkout@v4

      - name: Merge if a token is configured
        env:
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${AUTOMERGE_TOKEN:-}" ]; then
            echo "AUTOMERGE_TOKEN is not set — leaving PR #$PR for manual merge."
            echo
            echo "Why a PAT rather than the built-in GITHUB_TOKEN: a push made with"
            echo "GITHUB_TOKEN does NOT trigger further workflow runs, so merging with"
            echo "it would land the change on master and never fire the deploy job."
            echo "Set AUTOMERGE_TOKEN to a fine-grained PAT scoped to this repo with"
            echo "contents:write + pull_requests:write to complete the loop."
            exit 0
          fi
          GH_TOKEN="$AUTOMERGE_TOKEN" gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          echo "Merged PR #$PR (tier=low, agent branch)."
