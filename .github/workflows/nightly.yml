name: Nightly full suite

# The backstop for everything the merge gate does not run.
#
# It exists because the gate is being scoped: once the risk ladder lands, an
# ordinary source change runs only the tests its import graph can reach, and
# three classes of coupling are invisible to that graph — tests whose real
# subject is a file they read off disk rather than import, tests that mock a
# module they never import (the resolver drops mocked modules from the
# dependency graph entirely), and modules loaded by a computed string at
# runtime. Nothing catches those at PR time. This does, within twelve hours.
#
# It also runs the 42 *.integration.test.ts files the merge gate has never
# once executed. They are excluded there because they need a database; they get
# one here, and each already skips itself when its dependency is absent.
#
# DELIBERATELY A SEPARATE FILE, not another trigger on ci.yml. The gate job
# there has no `if:` condition, so any trigger added to that workflow fires it —
# a schedule would run the full gate as an extra job AND, because ci.yml's
# concurrency group is workflow-level, hold the deploy lock while doing it.

on:
  schedule:
    # Twice daily. GitHub cron is always UTC — there is no timezone option — so
    # these drift by an hour against London across DST, which does not matter
    # for a backstop. Twelve hours apart is what bounds the exposure window the
    # scoped gate trades away; widening the gap widens that window.
    - cron: '15 4 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

# Its own group, never sr-main-deploy — a nightly must not queue behind or ahead
# of a production deploy. Cancelling in progress is right here: if a newer
# nightly has started, the older one's verdict is stale and nobody wants both.
concurrency:
  group: sr-main-nightly
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  full:
    name: Full suite (everything the gate skips)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: postgresql://app:test@localhost:5432/strange_rambling
      SCRAPER_ALLOW_NON_HOMESERV: '1'
      PUBLIC_VAPID_PUBLIC_KEY: ci-nightly-placeholder
      # The integration tests the merge gate never runs reach the credential
      # vault, which refuses to start without a 64-hex-char key. Without this
      # the whole file errors in its beforeAll and every case inside it is
      # reported as failed — which is exactly what the first nightly run did
      # (run 31341122910, issue #178).
      #
      # A fixed throwaway value is correct here: it encrypts test-only rows in a
      # throwaway database that is destroyed with the runner. It is NOT a
      # secret, and must never be reused anywhere that stores real credentials.
      INTEGRATION_CREDENTIALS_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'

    steps:
      - name: Start Postgres in the background
        run: |
          nohup docker run --rm --name ci-postgres \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=strange_rambling \
            -p 5432:5432 \
            pgvector/pgvector:pg16 > /tmp/ci-postgres.log 2>&1 &
          echo "postgres pulling/booting in the background"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same step ci.yml runs before `npm ci`, and it was missing here for the
      # whole life of this workflow. Three suites need a working bubblewrap —
      # jkai/grounding/authored, workflows/site-tools/author-ephemeral-tool and
      # site-tools/tools/ephemeral-tools — and the hosted image does not ship
      # one, so every scheduled run died on "Isolated handler runner unavailable
      # (bubblewrap required)". 22 consecutive red runs, 2026-09-06 to 09-16,
      # during which the unscoped suite and the real-adapter build produced no
      # signal at all. The whole point of this workflow is to be the thing that
      # catches what the scoped gate cannot see.
      - name: Install isolated handler runner
        run: ./scripts/check-authored-runner.sh

      - run: npm ci

      # See ci.yml for why this polls a query rather than pg_isready: the image
      # runs a temporary server during initdb that pg_isready reports as ready,
      # then restarts it, dropping anything already connected.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 90); do
            if psql "$DATABASE_URL" -c 'select 1' >/dev/null 2>&1; then
              echo "postgres accepting queries after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not accept a query within 90s"
          docker logs ci-postgres 2>&1 | tail -40 || true
          exit 1

      - name: Prepare test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          CI=1 FORCE_COLOR=0 npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Lint gates
        run: npm run gate:public-routes && npm run gate:font-sizes

      - name: Type check
        run: npm run gate:check

      # The whole suite, integration tests included. Sequential rather than
      # concurrent with the type check: nothing is waiting on this run, and
      # keeping the two apart means a failure here is unambiguous.
      # The whole suite, integration tests included. Sequential rather than
      # concurrent with the type check: nothing is waiting on this run, and
      # keeping the two apart means a failure here is unambiguous.
      #
      # No exclusions any more. The three files that used to be excluded by path
      # (apis/registry, rag/pipeline, models/codex-live) now skip on the thing
      # they actually need — a resolvable OpenRouter key — rather than on
      # DATABASE_URL. They self-skip here and run for real on homeserv, which is
      # where the credentials live. An exclusion list would have drifted; a
      # correct guard cannot.
      - name: Full test suite
        run: npm run gate:test:full

      # `!cancelled()`, not the default. These two are independent questions —
      # "does the whole suite pass" and "does the real adapter still build" —
      # and chaining them meant one red answer suppressed the other. The build
      # did not run for eleven days because of a bubblewrap failure three steps
      # earlier that had nothing to do with it. Same polarity as the gate job in
      # ci.yml: run unless the whole run is being torn down.
      - name: Build with the real adapter
        if: ${{ !cancelled() }}
        run: npm run gate:build

      # A red run in the Actions tab is easy to miss for something nobody is
      # waiting on, and a silent backstop is not a backstop. One open issue at a
      # time: if the previous failure has not been dealt with, comment on it
      # rather than opening a second.
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly full suite is failing"
          # Deliberately NOT `--search`. GitHub's issue search is an index and it
          # lags by minutes, so an issue opened by the previous run is not
          # necessarily findable by the next one — which is exactly what happened
          # on 2026-08-09: run 31341819530 failed ~17 minutes after 31341122910
          # and opened a duplicate (#180) because the search could not yet see
          # #178. List and match client-side; the repo has nowhere near 200 open
          # issues, so this is exact and immediate.
          EXISTING=$(gh issue list --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL"
            echo "commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n\n%s\n\n%s' \
              "The nightly full suite failed: $RUN_URL" \
              "This is the backstop for coupling the scoped merge gate cannot see — tests coupled by filesystem reads, by module mocks, or by runtime string imports — plus the integration tests the gate never runs." \
              "A failure here means something reached master that PR-time selection did not cover. Worth understanding rather than just re-running.")"
            echo "opened a new issue"
          fi

      # An alarm that never clears is not an alarm, it is furniture.
      #
      # The failure step above dedupes on the issue TITLE, which is fixed. So the
      # issue opened for one breakage stays open after that breakage is fixed,
      # and the NEXT unrelated failure silently attaches itself to it. That is
      # exactly what happened: a green run on 2026-09-05 left #708 open, and the
      # bubblewrap breakage the following day inherited it — so the open issue
      # described the wrong problem for eleven days while 52 "still failing"
      # comments accumulated underneath it.
      #
      # Closing on green makes the issue's existence mean "the nightly is red
      # RIGHT NOW", which is the only thing worth paging on.
      - name: Close the failure issue once it is green again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly full suite is failing"
          # Same client-side match as the opener, and for the same reason: the
          # issue search index lags by minutes and cannot be trusted to find an
          # issue this workflow itself opened hours ago.
          EXISTING=$(gh issue list --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "Green again: $RUN_URL"
            gh issue close "$EXISTING"
            echo "closed #$EXISTING"
          else
            echo "nothing open to close"
          fi

  # The audit ci.yml already promises.
  #
  # ci.yml's "Audit production dependencies" step skips itself when the manifest
  # and lockfile are unchanged, on the reasoning that the graph is the same as
  # the already-gated base. That reasoning is sound for a PR and the skip should
  # stay — but its comment justifies it with "The nightly workflow still audits
  # the graph for advisories disclosed after it entered master", and that was
  # not true: this was the only `npm audit` in the repository and it lived
  # there. So an advisory published against a pinned version was invisible until
  # somebody happened to touch the lockfile for an unrelated reason.
  #
  # Its own job: it needs no database, no build and no 45-minute timeout, and a
  # red suite must not hide a new advisory (nor the reverse).
  #
  # --omit=dev deliberately, matching the gate. A required check pointed at the
  # dev graph reds on every routine esbuild or vite advisory in something that
  # never ships, and a check that cries wolf gets ignored — which is the failure
  # mode this whole workflow exists to correct.
  audit:
    name: Production dependencies have no known advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same three attempts as the gate. The advisory service is a live
      # dependency and a transient outage must not open an issue.
      - name: Audit production dependencies
        id: audit
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Audit attempt $attempt/3"
            if timeout 60 npm audit --omit=dev --audit-level=high > /tmp/audit.txt 2>&1; then
              cat /tmp/audit.txt
              echo "clean=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            last=$?
          done
          cat /tmp/audit.txt
          # Distinguish "found advisories" from "could not reach the service".
          # npm exits 1 for findings; a timeout exits 124.
          if [ "$last" = "124" ]; then
            echo "::warning::npm audit could not complete in three attempts; not reporting."
            echo "clean=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "clean=false" >> "$GITHUB_OUTPUT"
          exit 0

      # Same one-issue-at-a-time handling as the suite above.
      - name: Report advisories
        if: steps.audit.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Production dependencies have a high-severity advisory"
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s' \
            "The nightly audit found advisories in the production graph: $RUN_URL" \
            "$(head -c 40000 /tmp/audit.txt)" \
            "These are advisories disclosed AFTER the lockfile last changed, so the merge gate has never seen them — it skips the audit when the lockfile is unchanged.")
          EXISTING=$(gh issue list --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "Still present: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the advisory issue once it is clean
        if: steps.audit.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Production dependencies have a high-severity advisory"
          EXISTING=$(gh issue list --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "Clean again: $RUN_URL"
            gh issue close "$EXISTING"
            echo "closed #$EXISTING"
          fi

  # A pin that cannot go stale is a pin nobody checks. This is the check.
  #
  # Its own job, not a step in `full`: it needs no database, no build and no
  # 45-minute timeout, and a red gate must not hide a moved dependency (nor the
  # reverse). Runs on the same twice-daily schedule, so drift is noticed within
  # twelve hours instead of the sixteen weeks it took last time.
  #
  # It only ever REPORTS. Installing pi stays the deliberate path — move the pin
  # in a PR, prove it with a canary build, then scripts/deploy-builder.sh.
  pi-pin:
    name: pi pin still points somewhere real
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the pin against npm AND the upstream repo
        id: check
        env:
          # Lifts the anonymous GitHub API rate limit, which a shared runner IP
          # hits often enough to turn this into a flaky UNKNOWN.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-pi-version.mjs | tee /tmp/pi-pin.txt
          echo "verdict=$(node scripts/check-pi-version.mjs --json | node -p 'JSON.parse(require("fs").readFileSync(0)).verdict')" >> "$GITHUB_OUTPUT"

      # Same one-issue-at-a-time handling as the suite above, and for the same
      # reason: nobody is watching this tab, and a second issue per run would
      # bury the first.
      - name: Report drift
        if: steps.check.outputs.verdict != 'CURRENT'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          TITLE="pi pin needs attention: $VERDICT"
          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s' \
            "The nightly pin check reported \`$VERDICT\`: $RUN_URL" \
            "$(cat /tmp/pi-pin.txt)" \
            "Upgrading pi is pin -> dry-run -> canary -> smoke -> promote -> record; see the \`dependency-upgrades\` skill. Do not \`npm i -g\` on the box — it overwrites in place, so there is nothing to roll back to.")
          EXISTING=$(gh issue list --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "Still $VERDICT: $RUN_URL"
            echo "commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "opened a new issue"
          fi
